<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Lacuna — Beat 01 — Memory Aperture</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2");
          font-weight: 300 700;
          font-display: block;
        }
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: transparent;
          color: #ffffff;
          font-family: "Space Grotesk", Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        .b01-scene {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        .b01-ground {
          position: absolute;
          inset: 0;
          background: #000000;
        }
        .b01-reveal {
          position: absolute;
          inset: 0;
          overflow: hidden;
          will-change: clip-path;
        }
        .b01-camera-outer,
        .b01-camera-inner {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .b01-capture {
          position: absolute;
          inset: 0;
          display: block;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        .b01-mark {
          position: absolute;
          left: 750px;
          top: 330px;
          width: 420px;
          height: 420px;
          display: grid;
          place-items: center;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .b01-mark svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
          filter: drop-shadow(0 0 34px rgba(128, 82, 255, 0.22));
        }
        .b01-mark-path-aura {
          fill: none;
          stroke: #8052ff;
          stroke-opacity: 0.42;
          stroke-width: 3.8;
          stroke-linecap: round;
        }
        .b01-mark-path {
          fill: none;
          stroke: #ffffff;
          stroke-width: 1.65;
          stroke-linecap: round;
        }
        .b01-mark-orbit {
          fill: none;
          stroke: rgba(255, 255, 255, 0.12);
          stroke-width: 0.08;
          stroke-dasharray: 0.45 0.5;
        }
        .b01-mark-dot-outer {
          fill: #080808;
          stroke: #ffb829;
          stroke-width: 1.25;
        }
        .b01-mark-dot-inner { fill: #ffb829; }
      </style>

      <div data-hf-id="hf-b01-root" id="root" data-composition-id="beat-01-aperture" data-start="0" data-width="1920" data-height="1080" data-duration="9" data-fps="30">
        <section data-hf-id="hf-b01-scene" id="b01-scene" class="clip b01-scene" data-start="0" data-duration="9" data-track-index="1">
          <div data-hf-id="hf-b01-ground" class="b01-ground"></div>
          <div data-hf-id="hf-b01-reveal" id="b01-reveal" class="b01-reveal">
            <div data-hf-id="hf-b01-camera-outer" id="b01-camera-outer" class="b01-camera-outer" data-layout-allow-overflow>
              <div data-hf-id="hf-b01-camera-inner" id="b01-camera-inner" class="b01-camera-inner">
                <img data-hf-id="hf-b01-capture" id="b01-capture" class="b01-capture" src="capture-final/screenshots/scroll-000.png" alt="Exact Lacuna landing hero capture">
              </div>
            </div>
          </div>

          <div data-hf-id="hf-b01-mark" id="b01-mark" class="b01-mark" aria-hidden="true">
            <svg data-hf-id="hf-b01-mark-svg" viewBox="0 0 24 24">
              <circle data-hf-id="hf-b01-mark-orbit" id="b01-mark-orbit" class="b01-mark-orbit" cx="12" cy="12" r="10.4"></circle>
              <g data-hf-id="hf-b01-mark-group" transform="translate(-1.2 1.475)">
                <path data-hf-id="hf-b01-mark-aura" id="b01-mark-aura" class="b01-mark-path-aura" d="M12 2.6A8.4 8.4 0 0 1 12 19.4A6 6 0 0 1 12 7.4A3.7 3.7 0 0 1 12 14.8"></path>
                <path data-hf-id="hf-b01-mark-path" id="b01-mark-path" class="b01-mark-path" d="M12 2.6A8.4 8.4 0 0 1 12 19.4A6 6 0 0 1 12 7.4A3.7 3.7 0 0 1 12 14.8"></path>
                <circle data-hf-id="hf-b01-dot-outer" id="b01-dot-outer" class="b01-mark-dot-outer" cx="12" cy="2.6" r="2.25"></circle>
                <circle data-hf-id="hf-b01-dot-inner" id="b01-dot-inner" class="b01-mark-dot-inner" cx="12" cy="2.6" r="0.85"></circle>
              </g>
            </svg>
          </div>
        </section>
      </div>

      <script>
        (() => {
          const id = "beat-01-aperture";
          const tl = gsap.timeline({ paused: true });
          ["b01-mark-orbit", "b01-mark-aura", "b01-mark-path"].forEach((pathId) => {
            const path = document.getElementById(pathId);
            const length = path.getTotalLength();
            path.style.strokeDasharray = String(length);
            path.style.strokeDashoffset = String(length);
          });

          tl.addLabel("mark-draw", 0);
          tl.fromTo("#b01-mark", { opacity: 1, scale: 0.92 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power3.out" }, "mark-draw");
          tl.to("#b01-mark-aura", { strokeDashoffset: 0, duration: 0.92, ease: "power2.out" }, 0.08);
          tl.to("#b01-mark-path", { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" }, 0.22);
          tl.to("#b01-mark-orbit", { strokeDashoffset: 0, duration: 1.05, ease: "none" }, 0.16);
          tl.fromTo(["#b01-dot-outer", "#b01-dot-inner"], { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 0.72);

          tl.addLabel("world-open", 1.05);
          tl.fromTo("#b01-reveal", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(76% at 50% 50%)", duration: 1.8, ease: "power3.inOut" }, "world-open");
          tl.fromTo("#b01-camera-outer", { scale: 1.08 }, { scale: 1, duration: 1.8, ease: "power3.inOut" }, "world-open");
          tl.to("#b01-mark", { x: 354, y: -45, scale: 0.529, duration: 1.8, ease: "power3.inOut" }, "world-open");
          tl.to("#b01-mark", { opacity: 0, duration: 0.28, ease: "power1.in" }, 2.82);

          tl.addLabel("hero-breathe", 3.12);
          tl.to("#b01-camera-outer", { scale: 1.035, duration: 3.65, ease: "sine.inOut" }, "hero-breathe");
          tl.to("#b01-camera-inner", { x: -10, y: 2, duration: 3.65, ease: "sine.inOut" }, "hero-breathe");

          tl.addLabel("aperture-push", 7.15);
          tl.to("#b01-camera-outer", { scale: 3.2, duration: 1.85, ease: "power3.inOut" }, "aperture-push");
          tl.to("#b01-camera-inner", { x: -354, y: 45, duration: 1.85, ease: "power3.inOut" }, "aperture-push");

          window.__timelines = window.__timelines || {};
          window.__timelines[id] = tl;
        })();
      </script>
    </template>
  </body>
</html>
