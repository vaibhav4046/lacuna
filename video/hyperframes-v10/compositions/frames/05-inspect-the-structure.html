  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="05-inspect-the-structure"]');
      const nodesById = new Map([...root.querySelectorAll("[id]")].map((node) => [node.id, node]));
      const byId = (id) => nodesById.get(`05-inspect-the-structure-${id}`);
      const phases = [...root.querySelectorAll("[data-f05-phase]")];
      const paths = [...root.querySelectorAll("[data-f05-path]")];
      const timeline = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-inspect-the-structure"] = timeline;

      timeline.fromTo(
        byId("rail"),
        { opacity: 0, x: 42 },
        { opacity: 1, x: 0, duration: 0.72, ease: "power4.out" },
        0.08,
      );
      timeline.fromTo(
        byId("rail-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        0.35,
      );
      timeline.fromTo(
        byId("build-label"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.56,
      );
      timeline.fromTo(
        byId("metric-a"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" },
        1.05,
      );
      timeline.fromTo(
        byId("metric-b"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" },
        2.42,
      );

      timeline.fromTo(
        byId("overview-focus"),
        { opacity: 0 },
        { opacity: 0.72, duration: 0.55, ease: "power2.out" },
        4.2,
      );
      timeline.fromTo(
        byId("scan"),
        { x: 0, opacity: 0.15 },
        { x: 800, opacity: 0.62, duration: 6.15, ease: "power2.inOut" },
        4.25,
      );

      const phaseTimes = [4.45, 6.25, 8.15, 9.75];
      phases.forEach((phase, index) => {
        const rule = phase.querySelector("span");
        timeline.fromTo(
          phase,
          { opacity: 0, x: 12 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
          phaseTimes[index],
        );
        timeline.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.35, ease: "power3.out" },
          phaseTimes[index] + 0.12,
        );
      });

      timeline.to(
        byId("overview-focus"),
        { opacity: 0.16, duration: 0.38, ease: "power2.out" },
        10.8,
      );
      timeline.fromTo(
        byId("node-focus"),
        { opacity: 0, scale: 1.28, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.62, ease: "power4.out" },
        10.82,
      );
      timeline.fromTo(
        byId("selected"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.58, ease: "power3.out" },
        11.02,
      );

      const pathTimes = [11.35, 12.2, 13.08, 13.96];
      paths.forEach((step, index) => {
        timeline.fromTo(
          step,
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.56, ease: "power3.out" },
          pathTimes[index],
        );
      });

      timeline.fromTo(
        byId("node-dot"),
        { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" },
        14.55,
      );
    })();
  </script>
