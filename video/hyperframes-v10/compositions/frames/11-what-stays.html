  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="11-what-stays"]');
      const mark = root.querySelector('[data-role="mark"]');
      const anchorRule = root.querySelector('[data-role="anchor-rule"]');
      const cycleWord = root.querySelector('[data-role="cycle-word"]');
      const durableWords = Array.from(root.querySelectorAll('[data-role="durable-word"]'));
      const currentRule = root.querySelector('[data-role="durable-word"][data-accent="true"]');
      const topMeta = root.querySelector('[data-role="top-meta"]');
      const lockup = root.querySelector('[data-role="lockup"]');
      const brandName = root.querySelector('[data-role="brand-name"]');
      const brandLine = root.querySelector('[data-role="brand-line"]');

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["11-what-stays"] = tl;

      tl.fromTo(
        mark,
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.02,
      );
      tl.fromTo(
        anchorRule,
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        0.28,
      );
      tl.fromTo(
        cycleWord,
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.58,
      );

      const cycleStates = [
        { t: 0, text: "MODELS" },
        { t: 2.4, text: "AGENTS" },
        { t: 4.55, text: "MEMORY" },
      ];
      const cycleDriver = { t: 0 };
      let lastCycleText = "MODELS";

      tl.to(
        cycleDriver,
        {
          t: 6.8,
          duration: 6.8,
          ease: "none",
          onUpdate: () => {
            let nextText = cycleStates[0].text;
            for (let i = cycleStates.length - 1; i >= 0; i -= 1) {
              if (cycleDriver.t >= cycleStates[i].t) {
                nextText = cycleStates[i].text;
                break;
              }
            }
            if (nextText !== lastCycleText) {
              cycleWord.textContent = nextText;
              lastCycleText = nextText;
            }
          },
        },
        0,
      );

      const durableStarts = [6.88, 7.14, 7.42, 7.7, 7.96];
      const durableDistances = [68, 34, 48, 30, 44];
      const durableDurations = [0.19, 0.11, 0.15, 0.1, 0.13];

      durableWords.forEach((word, index) => {
        const at = durableStarts[index];
        tl.set(word, { opacity: 1, y: durableDistances[index] }, at);
        tl.to(
          word,
          { y: 0, duration: durableDurations[index], ease: "power4.out" },
          at,
        );
      });
      tl.fromTo(
        currentRule,
        { "--11-what-stays-rule-scale": 0 },
        { "--11-what-stays-rule-scale": 1, duration: 0.18, ease: "power3.out" },
        7.08,
      );

      gsap.set(topMeta, { opacity: 0 });
      gsap.set(lockup, { opacity: 0 });

      tl.fromTo(
        topMeta,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "power2.out" },
        9.2,
      );
      tl.set(lockup, { opacity: 1 }, 9.22);
      tl.fromTo(
        brandName,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.28, ease: "power4.out" },
        9.22,
      );
      tl.fromTo(
        brandLine,
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        9.29,
      );
      tl.to({}, { duration: 1.76 }, 9.74);
    })();
  </script>
