<template>
  <div
    id="root"
    class="clip"

    data-width="1920"

  ></div>

      font-family: "Space Grotesk";

      box-shadow: 0 0 0 1px rgba(0,0,0,0.55);
    }
  </style>
  <script>
    window.__timelines = window.__timelines || {};

    var sections = [
      { start: 0, end: 9.2, text: "Agents do not fail only because they forget. They fail when yesterday's truth is remembered as if it were still true." },
      { start: 9.2, end: 25.4, text: "One source says Redis. A proposal says Postgres. The pull request implements Postgres. Retrieval returns every sentence. Lacuna keeps the sources, marks what changed, exposes conflict, and refuses to turn missing evidence into a confident answer." },
      { start: 25.4, end: 38.4, text: "We built Lacuna, a provenance-first memory layer on HydraDB. Conversations become evidence, claims, entities, and relationships. Lacuna resolves what stands now, then compiles the context the next agent needs." },
      { start: 38.4, end: 59.2, text: "Here is the deployed product. I ask, Who is the runbook owner for billing-gate? Lacuna says the sources disagree, keeps both claims at equal weight, and attaches a contradiction trace. Ask for Foxglove's connection-pool size. Nothing states one, so Lacuna returns never stated, instead of guessing." },
      { start: 59.2, end: 75, text: "The answer stays inspectable. A table keeps every memory readable. On the accepted public build, the overview measured four hundred fifty-three nodes and six hundred eighty-two edges. The proof view follows one exact source-to-evidence-to-claim-to-entity path." },
      { start: 75, end: 91.8, text: "Memory becomes bounded work. Lacuna includes two built-in, no-write roles: Researcher and Reviewer. A production run persisted eight events, tool calls, handoff, artifacts, and its final verdict. A daily schedule persists. Cross-instance exactly-once dispatch is not claimed." },
      { start: 91.8, end: 115.8, text: "One resolved context reaches web, C L I, and M C P. The parity sweep sends all sixty-four questions through the C L I and both M C P transports, then compares every field. They match. The H T T P A P I is live. A packaged S D K is not shipped." },
      { start: 115.8, end: 131.8, text: "The voice surface models fifteen explicit states, including listening, interruption, and typed fallback. This narration uses the verified Vaibhav Lalwani professional clone. The product's live voice round-trip remains separately gated until its server key is configured." },
      { start: 131.8, end: 152, text: "HydraDB is the retrieval substrate, not a results bucket. A correction becomes a supersession edge. Provenance is the path from session to message to evidence span to claim. Disagreement is structural. Multi-hop answers traverse a bridge entity. No claim means absence, not a low similarity score." },
      { start: 152, end: 167, text: "On the labelled generated evaluation, Lacuna answers sixty-four of sixty-four with zero unsupported answers using about eighteen context tokens. The strongest tuned baseline reaches sixty-three using about eighteen hundred. Self-hosted and HydraDB Cloud matched field by field." },
      { start: 167, end: 177.3975, text: "Models can change. Agents can change. The memory stays current, inspectable, and portable. Lacuna: memory that knows what changed." }
    ];

    function splitSentences(text) {
      return text.split(/(?<=[.!?])\s+/).map(function (sentence) {
        return sentence.trim();
      }).filter(Boolean);
    }

    var root = document.getElementById("root");
    var groups = [];
    sections.forEach(function (section) {
      var sentences = splitSentences(section.text);
      var weights = sentences.map(function (sentence) {
        return sentence.split(/\s+/).length;
      });
      var totalWeight = weights.reduce(function (sum, value) { return sum + value; }, 0);
      var cursor = section.start;
      sentences.forEach(function (sentence, index) {
        var span = (section.end - section.start) * weights[index] / totalWeight;
        var line = document.createElement("div");
        line.className = "captions-line";
        line.setAttribute("data-layout-allow-overlap", "");
        line.setAttribute("data-layout-allow-occlusion", "");
        var copy = document.createElement("div");
        copy.className = "captions-copy";
        copy.textContent = sentence;
        line.appendChild(copy);
        root.appendChild(line);
        groups.push({ element: line, start: cursor, end: cursor + span });
        cursor += span;
      });
    });

    var tl = gsap.timeline({ paused: true });
    groups.forEach(function (group) {
      var enterDuration = Math.min(0.14, Math.max(0.04, (group.end - group.start) * 0.12));
      var exitDuration = Math.min(0.10, Math.max(0.04, (group.end - group.start) * 0.08));
      tl.fromTo(
        group.element,
        { opacity: 0, visibility: "visible", y: 8 },
        { opacity: 1, visibility: "visible", y: 0, duration: enterDuration, ease: "power3.out", immediateRender: false },
        group.start
      );
      tl.to(
        group.element,
        { opacity: 0, y: -4, duration: exitDuration, ease: "power2.in" },
        Math.max(group.start + enterDuration, group.end - exitDuration)
      );
      tl.set(group.element, { opacity: 0, visibility: "hidden" }, group.end);
    });
    window.__timelines["captions"] = tl;
  </script>
</template>
