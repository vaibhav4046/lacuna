<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Lacuna — readable memory, navigable graph</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 400 500;
        font-display: block;
      }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #000; }
      #b05-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .b05-fill { position: absolute; inset: 0; overflow: hidden; background: #000; }
      .b05-shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #b05-memory { width: 1920px; height: 3681.3333px; }
      #b05-graph, #b05-proof { width: 1920px; height: 1080px; opacity: 0; }
      .b05-edge {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);
      }
      .b05-rail {
        position: absolute;
        left: 58px;
        top: 50px;
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 10px;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.16);
        background: #030303;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.15em;
      }
      .b05-step {
        padding: 11px 14px;
        border: 1px solid rgba(255,255,255,0.10);
        color: #9a9a9a;
        opacity: 0.48;
      }
      .b05-step strong { color: #fff; font-weight: 500; }
      .b05-corner {
        position: absolute;
        right: 58px;
        bottom: 48px;
        color: #bdbdbd;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        padding: 12px 15px;
        border-right: 1px solid #8052ff;
        border-bottom: 1px solid #8052ff;
        background: #030303;
      }
      .b05-corner span { color: #8052ff; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dti3" id="b05-root" data-composition-id="beat-05-graph" data-start="0" data-width="1920" data-height="1080" data-duration="18" data-fps="30">
      <section data-hf-id="hf-wu79" id="b05-scene" class="clip b05-fill" data-start="0" data-duration="18" data-track-index="1">
        <img data-hf-id="hf-lzy2" id="b05-memory" class="b05-shot" src="assets/screens/live-memory-fullpage.png" alt="Captured Lacuna memory inventory with readable claim, scope, source, observed date, and standing rows">
        <img data-hf-id="hf-m2fa" id="b05-graph" class="b05-shot" src="assets/screens/live-graph-v8-1920x1080.png" alt="Captured Lacuna memory-field graph showing 453 total records, filters, navigation controls, and a readable list">
        <img data-hf-id="hf-pfqs" id="b05-proof" class="b05-shot" src="assets/screens/live-proof-graph-v8-1920x1080.png" alt="Captured Lacuna proof graph showing source, evidence, claim, entity, and context-pack columns">
        <div data-hf-id="hf-ea0f" class="b05-edge"></div>
        <div data-hf-id="hf-uehk" class="b05-rail">
          <span data-hf-id="hf-cvmw" id="b05-step-table" class="b05-step"><strong data-hf-id="hf-c73h">01</strong> READABLE INVENTORY</span>
          <span data-hf-id="hf-hnoz" id="b05-step-field" class="b05-step"><strong data-hf-id="hf-de0k">02</strong> MEMORY FIELD</span>
          <span data-hf-id="hf-liok" id="b05-step-proof" class="b05-step"><strong data-hf-id="hf-czpj">03</strong> PROOF GRAPH</span>
        </div>
        <div data-hf-id="hf-c3qg" class="b05-corner" data-layout-allow-caption-zone=""><span data-hf-id="hf-5dyn">CAPTURED UI</span> · PIXELS UNCHANGED</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const b05 = gsap.timeline({ paused: true });

      b05.addLabel("inventory", 0);
      b05.to("#b05-step-table", { opacity: 1, duration: 0.2 }, 0);
      b05.fromTo(
        "#b05-memory",
        { x: 0, y: 0, scale: 1 },
        { x: 0, y: -2380, scale: 1, duration: 5.15, ease: "power1.inOut" },
        0.45,
      );

      b05.addLabel("field", 5.6);
      b05.to("#b05-step-table", { opacity: 0.48, duration: 0.2 }, 5.6);
      b05.to("#b05-step-field", { opacity: 1, duration: 0.2 }, 5.6);
      b05.to("#b05-memory", { opacity: 0, duration: 0.3 }, 5.6);
      b05.fromTo(
        "#b05-graph",
        { opacity: 0, x: -20, y: -10, scale: 1.02 },
        { opacity: 1, x: -20, y: -10, scale: 1.02, duration: 0.3, ease: "none" },
        5.6,
      );
      b05.to(
        "#b05-graph",
        { x: -1427, y: 380, scale: 1.55, duration: 2.15, ease: "power3.inOut" },
        6.25,
      );
      b05.to(
        "#b05-graph",
        { x: -115, y: -73, scale: 1.07, duration: 2.05, ease: "power3.inOut" },
        8.95,
      );

      b05.addLabel("proof", 11.35);
      b05.to("#b05-step-field", { opacity: 0.48, duration: 0.2 }, 11.35);
      b05.to("#b05-step-proof", { opacity: 1, duration: 0.2 }, 11.35);
      b05.to("#b05-graph", { opacity: 0, duration: 0.32 }, 11.35);
      b05.fromTo(
        "#b05-proof",
        { opacity: 0, x: -19, y: -11, scale: 1.02 },
        { opacity: 1, x: -19, y: -11, scale: 1.02, duration: 0.32, ease: "none" },
        11.35,
      );
      b05.to(
        "#b05-proof",
        { x: -61, y: -241, scale: 1.18, duration: 2.2, ease: "power3.inOut" },
        12.05,
      );
      b05.to(
        "#b05-proof",
        { x: -1012, y: -175, scale: 1.34, duration: 1.8, ease: "power3.inOut" },
        15.15,
      );

      window.__timelines["beat-05-graph"] = b05;
    </script>
  </body>
</html>
