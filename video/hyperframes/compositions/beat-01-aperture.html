      <script>
        (() => {
          const id = "beat-01-aperture";
          const tl = gsap.timeline({ paused: true });
          const focus = document.getElementById("b01-ring-focus");
          const muted = document.getElementById("b01-ring-muted");

          [focus, muted].forEach((ring) => {
            const length = ring.getTotalLength();
            ring.style.strokeDasharray = String(length);
            ring.style.strokeDashoffset = String(length);
          });

          tl.addLabel("establish", 0);
          tl.fromTo("#b01-camera-outer", { scale: 0.982 }, { scale: 1, duration: 1.25, ease: "power3.out" }, "establish");
          tl.fromTo("#b01-frame", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 0.2);
          tl.to("#b01-ring-muted", { strokeDashoffset: 0, duration: 1.15, ease: "none" }, 0.35);
          tl.to("#b01-ring-focus", { strokeDashoffset: 0, duration: 0.95, ease: "power2.out" }, 0.62);

          const chips = [
            ["#b01-chip-meeting", -236, -110, -224, -124],
            ["#b01-chip-pr", 128, -214, 146, -201],
            ["#b01-chip-runbook", 154, 126, 136, 142],
            ["#b01-chip-chat", -226, 154, -210, 137]
          ];
          chips.forEach((item, index) => {
            const selector = item[0];
            const start = 0.74 + index * 0.16;
            tl.set(selector, { opacity: 1 }, start);
            tl.fromTo(selector, { x: item[1] * 0.72, y: item[2] * 0.72, scale: 0.92 }, {
              x: item[1], y: item[2], scale: 1, duration: 0.72, ease: "power3.out", immediateRender: false
            }, start);
            tl.to(selector, { x: item[3], y: item[4], duration: 4.35, ease: "sine.inOut" }, 1.55 + index * 0.08);
          });

          tl.fromTo("#b01-hud", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.2);
          tl.addLabel("aperture-push", 7.45);
          tl.to("#b01-camera-outer", { scale: 1.64, duration: 1.55, ease: "power3.inOut" }, "aperture-push");
          tl.to("#b01-camera-inner", { x: -354, y: 4, duration: 1.55, ease: "power3.inOut" }, "aperture-push");
          tl.to("#b01-hud", { opacity: 0, y: 16, duration: 0.34, ease: "power2.in" }, 7.38);
          tl.to("#b01-frame", { opacity: 0.24, duration: 0.45, ease: "power1.in" }, 7.55);

          window.__timelines = window.__timelines || {};
          window.__timelines[id] = tl;
        })();
