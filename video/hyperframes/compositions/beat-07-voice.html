<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Lacuna — honest voice surface</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
        font-weight: 400 500;
        font-display: block;
      }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #000; }
      #b07-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .b07-fill { position: absolute; inset: 0; overflow: hidden; background: #000; }
      .b07-screen {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        will-change: transform;
      }
      .b07-frame { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.08); pointer-events: none; }
      .b07-topline {
        position: absolute;
        left: 58px;
        right: 58px;
        top: 42px;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 18px;
        border: 1px solid rgba(255,255,255,0.15);
        background: #030303;
        color: #bdbdbd;
        font: 500 12px/1 "JetBrains Mono", monospace;
        letter-spacing: 0.15em;
      }
      .b07-topline strong { color: #8053ff; font-weight: 500; }
      .b07-pending { margin-left: auto; color: #fff; }
      .b07-pending::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 10px; background: #8053ff; }
      .b07-focus {
        position: absolute;
        border: 1px solid #8053ff;
        opacity: 0;
        pointer-events: none;
      }
      #b07-route-focus { left: 928px; top: 300px; width: 648px; height: 396px; }
      #b07-typed-focus { left: 258px; top: 466px; width: 1408px; height: 132px; }
      .b07-caption {
        position: absolute;
        left: 58px;
        bottom: 42px;
        min-width: 1050px;
        height: 68px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 18px;
        border-left: 2px solid #8053ff;
        background: #030303;
        color: #9a9a9a;
        font: 500 12px/1.35 "JetBrains Mono", monospace;
        letter-spacing: 0.13em;
        opacity: 0;
      }
      .b07-caption strong { color: #fff; font-weight: 500; }
      .b07-caption span { color: #8053ff; }
    </style>
  </head>
  <body>
    <div data-hf-id="b07-root" id="b07-root" data-composition-id="beat-07-voice" data-start="0" data-width="1920" data-height="1080" data-duration="12" data-fps="30">
      <section data-hf-id="b07-scene" id="b07-scene" class="clip b07-fill" data-start="0" data-duration="12" data-track-index="1">
        <img data-hf-id="b07-screen" id="b07-screen" class="b07-screen" src="assets/screens/live-voice-v8-1920x1080.png" alt="Captured Lacuna Voice surface in its real ready state with no active microphone, provider session, query, or audio playback and with typed fallback visible">
        <div data-hf-id="b07-route-focus" id="b07-route-focus" class="b07-focus"></div>
        <div data-hf-id="b07-typed-focus" id="b07-typed-focus" class="b07-focus"></div>
        <div data-hf-id="b07-frame" class="b07-frame"></div>
        <div data-hf-id="b07-topline" id="b07-topline" class="b07-topline" data-layout-allow-caption-zone="">
          <span data-hf-id="b07-route"><strong data-hf-id="hf-gt52">PRODUCT VOICE ROUTE</strong> · REAL CAPTURE</span>
          <span data-hf-id="b07-no-sim">NO STT/TTS ROUNDTRIP SIMULATED</span>
          <span data-hf-id="b07-pending" class="b07-pending">PROVIDER ACCEPTANCE PENDING</span>
        </div>
        <div data-hf-id="b07-caption" id="b07-caption" class="b07-caption" data-layout-allow-caption-zone="">
          <strong data-hf-id="b07-caption-title">FILM NARRATION · EXACT CLONE VERIFIED</strong>
          <span data-hf-id="b07-caption-voice">VAIBHAV LALWANI PROFESSIONAL</span>
          <span data-hf-id="b07-caption-pending">FINAL AUDIO · EXACT CLONE VERIFIED</span>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const b07 = gsap.timeline({ paused: true, defaults: { ease: "power3.inOut" } });

      b07.addLabel("voice-surface", 0);
      b07.fromTo(
        "#b07-screen",
        { x: 0, y: 0, scale: 1 },
        { x: -338, y: 186, scale: 1.18, duration: 3.0 },
        0.45,
      );
      b07.fromTo(
        "#b07-route-focus",
        { opacity: 0, scale: 0.99 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
        2.45,
      );

      b07.addLabel("typed-fallback", 4.05);
      b07.to("#b07-route-focus", { opacity: 0, duration: 0.22 }, 4.05);
      b07.to(
        "#b07-screen",
        { x: -428, y: -195, scale: 1.3, duration: 1.65, ease: "power3.inOut" },
        4.05,
      );
      b07.fromTo(
        "#b07-typed-focus",
        { opacity: 0, scale: 0.99 },
        { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
        5.5,
      );

      b07.addLabel("acceptance-truth", 7.15);
      b07.fromTo(
        "#b07-caption",
        { x: -28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.52, ease: "power3.out" },
        7.15,
      );
      b07.to("#b07-screen", { x: -446, y: -214, scale: 1.315, duration: 3.6, ease: "sine.inOut" }, 7.55);
      b07.to("#b07-typed-focus", { opacity: 0.58, duration: 0.35, ease: "power2.out" }, 10.8);

      window.__timelines["beat-07-voice"] = b07;
    </script>
  </body>
</html>
